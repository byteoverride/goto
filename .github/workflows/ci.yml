name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run ShellCheck
        run: shellcheck goto goto.sh install.sh verify.sh completions/goto.bash

  test:
    name: Tests (${{ matrix.shell }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        shell: [sh, bash]
        include:
          - os: ubuntu-latest
            shell: dash
          - os: ubuntu-latest
            shell: zsh
    steps:
      - uses: actions/checkout@v4
      - name: Install shells
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y dash zsh
      - name: Run tests
        run: ${{ matrix.shell }} verify.sh

  install-test:
    name: Install test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test make install
        run: |
          make install DESTDIR=/tmp/goto-test PREFIX=/usr
          test -x /tmp/goto-test/usr/bin/goto
          test -f /tmp/goto-test/usr/share/man/man1/goto.1
          test -f /tmp/goto-test/usr/share/goto/goto.sh
          test -f /tmp/goto-test/usr/share/bash-completion/completions/goto
          test -f /tmp/goto-test/usr/share/zsh/vendor-completions/_goto
          test -f /tmp/goto-test/usr/share/fish/vendor_completions.d/goto.fish
      - name: Test make uninstall
        run: |
          make uninstall DESTDIR=/tmp/goto-test PREFIX=/usr
          test ! -f /tmp/goto-test/usr/bin/goto
